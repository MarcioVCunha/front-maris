<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Promoções — Maris Semijoias</title>
    <link rel="stylesheet" href="/promocoes/promocoes.css">
    <script src="/shared/staff-auth.js"></script>
    <script src="/env.js"></script>
    <script src="/shared/utils.js"></script>
    <script src="/shared/api.js"></script>
    <script src="/shared/ui.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  </head>

  <body>
    <header class="promo-header">
      <a class="back-link" href="/admin">← Voltar à administração</a>
      <h1>Promoções</h1>
      <p>Ative a promoção de um produto ou de um tipo e defina o percentual de desconto. O preço base não é alterado. Produtos com tipos só vendem pelos tipos — promova cada tipo abaixo.</p>
      <label for="promo-search" class="visually-hidden">Buscar produtos</label>
      <input id="promo-search" class="promo-search" type="search" placeholder="Buscar por nome, código ou tipo…" autocomplete="off" enterkeyhint="search">
    </header>

    <main class="promo-main">
      <section class="promo-bulk">
        <div class="promo-bulk-apply">
          <span class="promo-bulk-label">Colocar o site todo em promoção</span>
          <span class="promo-pct">
            <input id="bulk-percent" type="number" min="0" max="100" step="1" value="10">
            % off
          </span>
          <button id="bulk-apply-btn" type="button" class="promo-save">Aplicar a todos</button>
        </div>
        <button id="bulk-clear-btn" type="button" class="promo-clear">Limpar todas as promoções</button>
      </section>

      <div id="promo-feedback" class="promo-feedback" hidden></div>
      <div id="promo-list" class="promo-list"></div>
    </main>

    <script type="module" src="/promocoes/promocoes.logic.js"></script>
    <script defer src="/promocoes/promocoes.js"></script>
    <script>
      window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
    </script>
    <script defer src="/_vercel/insights/script.js"></script>
    <script>
      window.si = window.si || function () { (window.siq = window.siq || []).push(arguments); };
    </script>
    <script defer src="/_vercel/speed-insights/script.js"></script>
  </body>
</html>
