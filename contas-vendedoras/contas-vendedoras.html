<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contas vendedoras — Maris Semijoias</title>
  <link rel="stylesheet" href="/contas-vendedoras/contas-vendedoras.css">
  <script src="/shared/staff-auth.js"></script>
  <script src="/env.js"></script>
  <script src="/shared/utils.js"></script>
  <script src="/shared/api.js"></script>
  <script src="/shared/ui.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <header>
    <a class="back-link" href="/vendedoras">← Voltar às vendedoras</a>
    <h1>Maris Semijoias</h1>
    <p>Contas vendedoras</p>
  </header>

  <main class="container">
    <section class="toolbar card">
      <div class="toolbar-filters">
        <div class="toolbar-row">
          <label for="filter-paid">Situação do pagamento</label>
          <select id="filter-paid">
            <option value="unpaid" selected>A receber (não pagas)</option>
            <option value="paid">Pagas</option>
            <option value="all">Todas</option>
            <option value="cancelled">Canceladas</option>
          </select>
        </div>
        <div class="toolbar-row">
          <label for="search-input">Buscar (produto, código, vendedora)</label>
          <input id="search-input" type="search" placeholder="Digite para filtrar a lista atual" autocomplete="off" enterkeyhint="search">
        </div>
      </div>
      <div class="toolbar-options">
        <label class="checkbox-line">
          <input type="checkbox" id="select-all-visible" class="select-all-checkbox" title="Selecionar todas visíveis" aria-label="Selecionar todas as vendas visíveis">
          Selecionar todas visíveis
        </label>
        <label class="checkbox-line">
          <input type="checkbox" id="modo-repasse">
          Modo repasse (70% ao titular)
        </label>
      </div>
      <div class="selection-bar">
        <p id="toolbar-selected" class="toolbar-selected" aria-live="polite"></p>
        <button type="button" id="btn-marcar-repasse" class="btn-repasse" disabled>
          Marcar selecionadas como pagas
        </button>
      </div>
    </section>

    <div id="message" class="message" role="status"></div>

    <div id="sales-grid" class="sales-grid" role="list" aria-live="polite">
      <p class="empty-cell">Carregando…</p>
    </div>
  </main>

  <script src="/contas-vendedoras/contas-vendedoras.js"></script>
  <script defer src="/shared/analytics-guard.js"></script>
</body>
</html>
