<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acesso da equipe — Maris</title>
  <link rel="stylesheet" href="home.css">
  <style>
    .gate-wrap { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; }
    .gate-brand { text-align: center; margin-bottom: 28px; text-decoration: none; color: inherit; }
    .gate-brand span:first-child { font-family: var(--maris-font-display); font-size: 2rem; display: block; }
    .gate-brand span:last-child { font-size: 0.65rem; letter-spacing: 0.28em; text-transform: uppercase; color: var(--maris-gold-dark); }
    .gate-card { width: 100%; max-width: 400px; padding: 32px; background: var(--maris-surface); border: 1px solid var(--maris-border); border-radius: var(--maris-radius-lg); box-shadow: var(--maris-shadow); }
    .gate-card h1 { font-family: var(--maris-font-display); font-size: 1.5rem; margin: 0 0 8px; font-weight: 600; }
    .gate-card p { color: var(--maris-text-muted); margin: 0 0 24px; font-size: 0.95rem; }
    .gate-card label { display: block; margin-bottom: 8px; font-size: 0.72rem; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--maris-text-muted); }
    .gate-card input { width: 100%; padding: 12px 14px; border: 1px solid var(--maris-border); border-radius: var(--maris-radius); box-sizing: border-box; margin-bottom: 16px; font-family: inherit; }
    .gate-card button { width: 100%; padding: 14px; background: var(--maris-black); color: #fff; border: none; border-radius: var(--maris-radius); font-family: inherit; font-size: 0.8rem; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; cursor: pointer; }
    .gate-card button:disabled { opacity: 0.5; cursor: not-allowed; }
    .gate-msg { margin-top: 14px; font-size: 0.9rem; min-height: 1.2em; }
    .gate-msg.error { color: #a94442; }
    .gate-catalog-link { display: block; margin-top: 24px; text-align: center; font-size: 0.8rem; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--maris-text-muted); text-decoration: none; }
    .gate-catalog-link:hover { color: var(--maris-gold-dark); }
  </style>
  <script src="env.js"></script>
</head>
<body>
  <div class="gate-wrap">
  <a href="catalog/catalog.html" class="gate-brand"><span>Maris</span><span>Semijoias</span></a>
  <div class="gate-card">
    <h1>Área da equipe</h1>
    <p>Digite a senha para acessar administração e vendas.</p>
    <form id="gate-form">
      <label for="staff-password">Senha</label>
      <input id="staff-password" type="password" autocomplete="current-password" required>
      <button type="submit" id="gate-submit">Entrar</button>
    </form>
    <div id="gate-message" class="gate-msg"></div>
    <a class="gate-catalog-link" href="catalog/catalog.html">Ver catálogo público</a>
  </div>
  </div>
  <script>
    const form = document.getElementById("gate-form")
    const passwordInput = document.getElementById("staff-password")
    const messageEl = document.getElementById("gate-message")
    const submitBtn = document.getElementById("gate-submit")

    const params = new URLSearchParams(window.location.search)
    const nextUrl = params.get("next") ? decodeURIComponent(params.get("next")) : "index.html"

    if (sessionStorage.getItem("maris_staff_token")) {
      const part = sessionStorage.getItem("maris_staff_token").split(".")[1]
      try {
        const payload = JSON.parse(atob(part.replace(/-/g, "+").replace(/_/g, "/")))
        if (payload.exp > Math.floor(Date.now() / 1000)) {
          window.location.replace(nextUrl.startsWith("/") ? nextUrl.slice(1) : nextUrl)
        }
      } catch (_) {}
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault()
      messageEl.textContent = ""
      messageEl.className = "gate-msg"
      submitBtn.disabled = true

      try {
        const url = window.ENV.SUPABASE_STAFF_VERIFY_URL
        const res = await fetch(url, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ password: passwordInput.value })
        })
        const data = await res.json()
        if (!res.ok) {
          messageEl.textContent = data.error || "Senha incorreta."
          messageEl.className = "gate-msg error"
          return
        }
        sessionStorage.setItem("maris_staff_token", data.token)
        window.location.replace(nextUrl.startsWith("/") ? nextUrl.slice(1) : nextUrl)
      } catch {
        messageEl.textContent = "Erro de conexão. Tente novamente."
        messageEl.className = "gate-msg error"
      } finally {
        submitBtn.disabled = false
      }
    })
  </script>
</body>
</html>
