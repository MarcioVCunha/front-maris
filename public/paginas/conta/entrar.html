<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar — Maris Semijoias</title>
    <link rel="canonical" href="https://lojamaris.com.br/entrar">
    <link rel="stylesheet" href="/assets/maris-theme.css">
    <link rel="stylesheet" href="/paginas/conta/conta.css">
    <script src="/env.js"></script>
  </head>
  <body hidden>
    <header class="site-header">
      <div class="site-header-inner">
        <a href="/catalog" class="site-brand" aria-label="Maris Semijoias — início">
          <span class="site-brand-main">Maris</span>
          <span class="site-brand-sub">Semijoias</span>
        </a>
        <nav class="site-nav" aria-label="Conta">
          <a href="/catalog" class="site-nav-link">Catálogo</a>
          <a href="/entrar" class="site-nav-link site-nav-account" id="header-account-link" hidden>Entrar</a>
        </nav>
      </div>
    </header>
    <main class="conta-page">
      <div class="conta-stack">
        <section class="conta-card">
          <h1>Entrar</h1>
          <p class="conta-lead">Use sua senha ou um código no e-mail.</p>
          <div class="conta-tabs" role="tablist" aria-label="Forma de entrada">
            <button type="button" class="conta-tab" role="tab" id="tab-senha" data-tab="senha" aria-selected="true" aria-controls="panel-senha">Senha</button>
            <button type="button" class="conta-tab" role="tab" id="tab-codigo" data-tab="codigo" aria-selected="false" aria-controls="panel-codigo">Código</button>
          </div>
          <p id="entrar-msg" class="conta-msg" role="status" aria-live="polite" hidden></p>

          <div id="panel-senha" role="tabpanel" aria-labelledby="tab-senha">
            <form id="senha-form">
              <div class="conta-field">
                <label for="senha-email">E-mail</label>
                <input id="senha-email" type="email" autocomplete="username" inputmode="email" required>
              </div>
              <div class="conta-field">
                <label for="senha-password">Senha</label>
                <div class="conta-password">
                  <input id="senha-password" type="password" autocomplete="current-password" required>
                  <button type="button" class="conta-text-btn" id="senha-toggle" aria-pressed="false">Mostrar</button>
                </div>
              </div>
              <div class="conta-actions">
                <button type="submit" class="conta-btn" id="senha-submit">Entrar</button>
              </div>
            </form>
          </div>

          <div id="panel-codigo" role="tabpanel" aria-labelledby="tab-codigo" hidden>
            <form id="codigo-form">
              <div class="conta-field">
                <label for="codigo-email">E-mail</label>
                <input id="codigo-email" type="email" autocomplete="username" inputmode="email" required>
              </div>
              <div class="conta-actions">
                <button type="submit" class="conta-btn" id="codigo-send">Enviar código</button>
              </div>
            </form>
            <form id="codigo-verify" hidden>
              <div class="conta-field">
                <label for="codigo-token">Código</label>
                <input id="codigo-token" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="6 dígitos">
              </div>
              <div class="conta-actions">
                <button type="submit" class="conta-btn" id="codigo-confirm" disabled>Confirmar</button>
              </div>
            </form>
          </div>

          <p class="conta-links">
            <a id="link-criar" href="/criar-conta">Criar conta</a>
            <a id="link-esqueci" href="/esqueci-senha">Esqueci a senha</a>
          </p>
          <p class="conta-note"><a href="/privacidade">Privacidade</a></p>
        </section>
      </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2" integrity="sha384-WgXwGL6fUsYJWNaKJgVbrJKGRQwc1vieh2oy4kw9nXqpNDz3tdSsqEYUgeHD/NuF" crossorigin="anonymous"></script>
    <script type="module" src="/compartilhado/cliente-nav.js"></script>
    <script type="module" src="/paginas/conta/entrar.js"></script>
  </body>
</html>
