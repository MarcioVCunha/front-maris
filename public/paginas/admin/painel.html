<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel — Maris Semijoias</title>
  <link rel="stylesheet" href="/compartilhado/loading.css">
  <link rel="stylesheet" href="/paginas/admin/painel.css">
</head>
<body class="painel">
  <div id="staff-loading" class="boot-loading">
    <div class="maris-loading maris-loading--lg" role="status" aria-label="Carregando">
      <svg class="maris-loading__spark" viewBox="0 0 32 32" width="52" height="52" aria-hidden="true" focusable="false">
        <path class="maris-loading__spark-outline" d="M16 1.2 19.4 12.6 30.8 16 19.4 19.4 16 30.8 12.6 19.4 1.2 16 12.6 12.6 Z" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"></path>
        <path class="maris-loading__spark-fill" d="M16 1.2 19.4 12.6 30.8 16 19.4 19.4 16 30.8 12.6 19.4 1.2 16 12.6 12.6 Z" fill="currentColor"></path>
      </svg>
    </div>
  </div>
  <div id="panel" class="panel-shell" hidden>
    <aside class="panel-rail">
      <a class="back-link" href="/inicio">← Voltar ao início</a>
      <p id="staff-who" class="who" hidden></p>
      <h1 id="view-title">Painel</h1>
      <nav id="dash-nav" class="dash-nav" aria-label="Painel"></nav>
      <nav id="stock-nav" class="subnav" hidden aria-label="Estoque"></nav>
      <button type="button" id="shortcuts-help-btn" class="shortcuts-help-btn" title="Atalhos de teclado (?)">⌨️ Atalhos (?)</button>
      <div class="session">
        <button type="button" id="staff-logout-btn" class="btn-sair">Sair</button>
      </div>
    </aside>
    <div class="panel-body">
      <main id="view" class="view"></main>
      <p id="message" class="note" hidden role="status"></p>
    </div>
    <div id="fab-root" class="fab-root">
      <div class="fab-menu" id="fab-menu" hidden>
        <a class="fab-menu__item" href="/admin/adicionar" data-fab="peca">Nova peça</a>
        <a class="fab-menu__item" href="/vendas/nova" data-fab="venda">Nova venda</a>
      </div>
      <button type="button" id="fab-toggle" class="fab-btn" aria-expanded="false" aria-controls="fab-menu" aria-label="Atalhos">+</button>
    </div>
    <dialog id="archive-dialog"></dialog>
    <dialog id="sale-dialog" class="sale-dialog"></dialog>
    <dialog id="conjunto-dialog" class="conjunto-dialog"></dialog>
    <dialog id="piece-dialog" class="piece-dialog"></dialog>
    <dialog id="collection-dialog" class="collection-dialog"></dialog>
    <dialog id="promo-dialog" class="promo-dialog"></dialog>
    <dialog id="batch-dialog" class="batch-dialog"></dialog>
    <dialog id="history-dialog" class="history-dialog"></dialog>
    <dialog id="coupon-dialog" class="coupon-dialog promo-dialog"></dialog>
    <dialog id="referral-code-dialog" class="referral-code-dialog promo-dialog"></dialog>
    <dialog id="shortcuts-dialog" class="shortcuts-dialog"></dialog>
  </div>
  <script src="/env.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2" integrity="sha384-WgXwGL6fUsYJWNaKJgVbrJKGRQwc1vieh2oy4kw9nXqpNDz3tdSsqEYUgeHD/NuF" crossorigin="anonymous"></script>
  <script src="/compartilhado/utils.js"></script>
  <script src="/compartilhado/api.js"></script>
  <script src="/compartilhado/staff-data.js"></script>
  <script src="/compartilhado/staff-auth.js" data-optional></script>
  <script type="module" src="/compartilhado/loading.js"></script>
  <script type="module" src="/paginas/admin/painel.js"></script>
</body>
</html>
