<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acesso da equipe — Maris Semijoias</title>
  <link rel="stylesheet" href="/assets/home.css">
  <link rel="stylesheet" href="/paginas/admin/equipe.css">
  <script src="/env.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2"></script>
  <script src="/compartilhado/utils.js"></script>
  <script src="/compartilhado/api.js"></script>
  <script src="/compartilhado/staff-data.js"></script>
  <script src="/compartilhado/staff-auth.js"></script>
</head>
<body>
  <div class="gate-wrap">
    <a href="/catalog" class="gate-brand"><span>Maris</span><span>Semijoias</span></a>
    <div class="gate-card">
      <h1>Área da equipe</h1>
      <p id="gate-lead">Entre com o e-mail e a senha da sua conta.</p>

      <form id="login-form" class="gate-form">
        <label for="staff-email">E-mail</label>
        <input id="staff-email" type="email" autocomplete="username" inputmode="email" required autofocus>
        <label for="staff-password">Senha</label>
        <input id="staff-password" type="password" autocomplete="current-password" required>
        <button type="submit" id="login-submit">Entrar</button>
        <button type="button" id="show-reset" class="gate-text-btn">Esqueci minha senha</button>
      </form>

      <form id="reset-form" class="gate-form" hidden>
        <label for="reset-email">E-mail</label>
        <input id="reset-email" type="email" autocomplete="username" inputmode="email" required>
        <button type="submit" id="reset-submit">Enviar link</button>
        <button type="button" id="show-login" class="gate-text-btn">Voltar para entrar</button>
      </form>

      <div id="gate-message" class="gate-msg" role="status" aria-live="polite"></div>
      <a class="gate-catalog-link" href="/catalog">Ver catálogo público</a>
    </div>
  </div>
  <script>
    const Auth = window.MarisStaffAuth
    const params = new URLSearchParams(window.location.search)
    const nextUrl = Auth.safeNextPath(params.get("next"))
    const loginForm = document.getElementById("login-form")
    const resetForm = document.getElementById("reset-form")
    const messageEl = document.getElementById("gate-message")
    const leadEl = document.getElementById("gate-lead")
    const loginSubmit = document.getElementById("login-submit")
    const resetSubmit = document.getElementById("reset-submit")

    function showMessage(text, type) {
      messageEl.textContent = text || ""
      messageEl.className = type ? `gate-msg ${type}` : "gate-msg"
    }

    function showLogin() {
      resetForm.hidden = true
      loginForm.hidden = false
      leadEl.textContent = "Entre com o e-mail e a senha da sua conta."
    }

    function showReset() {
      loginForm.hidden = true
      resetForm.hidden = false
      leadEl.textContent = "Enviaremos um link para você criar uma nova senha."
      const email = document.getElementById("staff-email").value
      if (email) document.getElementById("reset-email").value = email
    }

    if (params.get("senha") === "ok") {
      showMessage("Senha atualizada. Entre com a nova senha.", "success")
    }

    if (Auth.isValid()) {
      Auth.loadProfile().then(async (profile) => {
        if (profile.ok) {
          window.location.replace(nextUrl)
          return
        }
        await Auth.signOut()
        showMessage(profile.error || "Esta conta não faz parte da equipe.", "error")
      })
    }

    document.getElementById("show-reset").addEventListener("click", () => {
      showMessage("")
      showReset()
    })
    document.getElementById("show-login").addEventListener("click", () => {
      showMessage("")
      showLogin()
    })

    loginForm.addEventListener("submit", async (e) => {
      e.preventDefault()
      showMessage("")
      loginSubmit.disabled = true
      try {
        const result = await Auth.signInAndLoadProfile(
          document.getElementById("staff-email").value,
          document.getElementById("staff-password").value
        )
        if (!result.ok) {
          showMessage(result.error, "error")
          return
        }
        window.location.replace(nextUrl)
      } finally {
        loginSubmit.disabled = false
      }
    })

    resetForm.addEventListener("submit", async (e) => {
      e.preventDefault()
      showMessage("")
      resetSubmit.disabled = true
      try {
        const result = await Auth.requestPasswordReset(document.getElementById("reset-email").value)
        const message = Auth.resetRequestMessage(result)
        showMessage(message.text, message.type)
      } finally {
        resetSubmit.disabled = false
      }
    })
  </script>
  <script>
    window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
  </script>
  <script defer src="/_vercel/insights/script.js"></script>
  <script>
    window.si = window.si || function () { (window.siq = window.siq || []).push(arguments); };
  </script>
  <script defer src="/_vercel/speed-insights/script.js"></script>
</body>
</html>
