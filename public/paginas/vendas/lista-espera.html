<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lista de espera — Maris Semijoias</title>
  <link rel="stylesheet" href="/paginas/vendas/vendas.css">
  <script src="/compartilhado/staff-auth.js"></script>
  <script src="/env.js"></script>
  <script src="/compartilhado/utils.js"></script>
  <script src="/compartilhado/api.js"></script>
  <script src="/compartilhado/ui.js"></script>
</head>
<body>
<header>
  <a class="back-link" href="/vendedoras">← Voltar às vendedoras</a>
  <h1>Lista de espera</h1>
  <p>Clientes aguardando peças em falta — avise manualmente pelo WhatsApp ou e-mail</p>
</header>
<main class="container">
  <section class="card">
    <label for="status-filter">Status</label>
    <select id="status-filter">
      <option value="waiting">Aguardando</option>
      <option value="contacted">Já avisados</option>
      <option value="all">Todos</option>
    </select>
    <button type="button" id="reload-waitlist" class="btn-reload">Atualizar lista</button>
    <p id="waitlist-count" class="waitlist-count" aria-live="polite"></p>
  </section>
  <p id="waitlist-feedback" class="message" hidden role="status"></p>
  <div id="waitlist-table-wrap"></div>
</main>
<script src="/paginas/vendas/lista-espera.js"></script>
<script>
  window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
</script>
<script defer src="/_vercel/insights/script.js"></script>
<script>
  window.si = window.si || function () { (window.siq = window.siq || []).push(arguments); };
</script>
<script defer src="/_vercel/speed-insights/script.js"></script>
</body>
</html>
