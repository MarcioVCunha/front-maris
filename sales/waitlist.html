<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lista de espera — Maris</title>
  <link rel="stylesheet" href="/sales/sales.css">
  <script src="/shared/staff-auth.js"></script>
  <script src="/shared/env.js"></script>
  <script src="/shared/api.js"></script>
</head>
<body>
<header>
  <a class="back-link" href="/vendedoras">← Voltar às vendedoras</a>
  <h1>Lista de espera</h1>
  <p>Clientes aguardando peças em falta — avise manualmente pelo WhatsApp ou e-mail</p>
</header>
<main class="container">
  <section class="card">
    <label for="status-filter">Status</label>
    <select id="status-filter">
      <option value="waiting">Aguardando</option>
      <option value="contacted">Já avisados</option>
      <option value="all">Todos</option>
    </select>
    <button type="button" id="reload-waitlist" class="btn-reload">Atualizar</button>
  </section>
  <div id="waitlist-table-wrap"></div>
</main>
<script src="/sales/waitlist.js"></script>
</body>
</html>
