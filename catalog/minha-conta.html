<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minha conta — Maris</title>
  <link rel="stylesheet" href="../maris-theme.css">
  <link rel="stylesheet" href="auth.css">
  <script src="../env.js"></script>
  <script src="../utils.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="customer-auth.js"></script>
</head>
<body class="auth-page">
  <header class="catalog-header">
    <a href="/catalog" class="auth-brand">
      <span class="auth-brand-main">Maris</span>
      <span class="auth-brand-sub">Semijoias</span>
    </a>
    <a href="/catalog" class="back-catalog">Voltar ao catálogo</a>
    <h1>Minha conta</h1>
  </header>
  <main class="auth-main">
    <section class="auth-card">
      <h2>Meus dados</h2>
      <form id="profile-form">
        <label>E-mail</label>
        <input type="email" id="profile-email" disabled>
        <label>Nome</label>
        <input type="text" id="profile-name" required>
        <label>WhatsApp</label>
        <input type="tel" id="profile-whatsapp" required>
        <button type="submit">Salvar</button>
      </form>
      <p id="profile-message" class="auth-message"></p>
      <button type="button" id="logout-btn" class="btn-secondary" style="margin-top:12px;width:100%;padding:10px;">Sair</button>
    </section>

    <section class="auth-card" style="margin-top:20px;">
      <h2>Lista de espera</h2>
      <ul id="waitlist-list" class="account-list"></ul>
    </section>
  </main>
  <script src="minha-conta.js"></script>
</body>
</html>
