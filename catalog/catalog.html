<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo — Maris Semijoias</title>

    <link rel="stylesheet" href="/maris-theme.css">
    <link rel="stylesheet" href="/catalog/catalog.css">
    <script src="/env.js"></script>
    <script src="/shared/utils.js"></script>
    <script src="/shared/api.js"></script>
    <script src="/shared/ui.js"></script>
    <script src="/shared/cart-resolver.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  </head>

  <body>
    <header class="site-header">
      <div class="site-header-inner">
        <a href="/catalog" class="site-brand" aria-label="Maris Semijoias — início">
          <span class="site-brand-main">Maris</span>
          <span class="site-brand-sub">Semijoias</span>
        </a>
        <nav class="site-nav" aria-label="Navegação do catálogo">
          <a href="/catalog/carrinho" class="site-nav-cart" id="header-cart-btn">Minha cesta (<span id="header-cart-count">0</span>)</a>
        </nav>
      </div>
    </header>

    <main class="catalog-main">
      <div class="catalog-toolbar">
        <div class="product-search">
          <label for="catalog-search" class="catalog-search-label">Buscar no catálogo</label>
          <input
            id="catalog-search"
            type="search"
            placeholder="Nome (ex.: Brinco) ou código (ex.: BM1786)"
            autocomplete="off"
            enterkeyhint="search"
          />
        </div>
        <div class="catalog-sort">
          <label for="catalog-sort" class="catalog-search-label">Ordenar por</label>
          <select id="catalog-sort">
            <option value="name_asc">Nome (A-Z)</option>
            <option value="price_asc">Preço (menor primeiro)</option>
            <option value="price_desc">Preço (maior primeiro)</option>
            <option value="created_desc">Mais recentes</option>
            <option value="created_asc">Mais antigos</option>
          </select>
        </div>
      </div>
      <p id="catalog-feedback" class="catalog-feedback" hidden></p>

      <!-- Lista de produtos renderizada pelo `catalog.js`. -->
      <div id="catalog" class="catalog"></div>

      <section id="unavailable-products-section" class="unavailable-products">
        <h2 class="section-heading">Em falta — lista de espera</h2>
        <div id="unavailable-products-grid" class="catalog unavailable-catalog"></div>
      </section>
    </main>

    <div id="product-modal" class="product-modal" hidden>
      <div class="product-modal-backdrop" data-close-modal="true"></div>
      <div class="product-modal-content" role="dialog" aria-modal="true" aria-labelledby="product-modal-title">
        <button id="product-modal-close" class="product-modal-close" type="button" aria-label="Fechar">×</button>
        <div class="product-modal-carousel">
          <button id="product-modal-prev" class="carousel-nav prev" type="button" aria-label="Imagem anterior">‹</button>
          <img id="product-modal-image" class="product-modal-image" src="" alt="">
          <button id="product-modal-next" class="carousel-nav next" type="button" aria-label="Próxima imagem">›</button>
        </div>
        <div id="product-modal-dots" class="carousel-dots" aria-label="Lista de imagens do produto"></div>
        <h3 id="product-modal-title"></h3>
        <div id="product-modal-code" class="modal-line"></div>
        <div id="product-modal-price" class="modal-line"></div>
        <div id="product-modal-stock" class="modal-line"></div>
        <div id="product-modal-status" class="modal-status"></div>

        <section class="modal-components">
          <h4>Tipos</h4>
          <p class="modal-components-help">Consulte os tipos disponíveis. Para alterações, fale com o vendedor.</p>
          <div id="product-modal-components-list" class="modal-components-list"></div>
        </section>

        <div id="product-modal-actions" class="modal-actions"></div>
      </div>
    </div>

    <div id="waitlist-modal" class="product-modal" hidden>
      <div class="product-modal-backdrop" data-close-waitlist="true"></div>
      <div class="product-modal-content waitlist-modal-content" role="dialog" aria-modal="true" aria-labelledby="waitlist-modal-title">
        <h3 id="waitlist-modal-title">Entrar na lista de espera</h3>
        <p class="waitlist-modal-help">Deixe seus dados e avisamos quando a peça voltar.</p>
        <form id="waitlist-form" class="waitlist-form">
          <label for="waitlist-name">Nome</label>
          <input id="waitlist-name" type="text" autocomplete="name" required>
          <label for="waitlist-whatsapp">WhatsApp (com DDD)</label>
          <input id="waitlist-whatsapp" type="tel" inputmode="numeric" autocomplete="tel" required>
          <label for="waitlist-email">E-mail (opcional)</label>
          <input id="waitlist-email" type="email" autocomplete="email">
          <p id="waitlist-feedback" class="waitlist-feedback" hidden></p>
          <div class="waitlist-actions">
            <button type="button" class="btn-secondary" data-close-waitlist="true">Cancelar</button>
            <button type="submit" id="waitlist-submit" class="btn-primary">Entrar na lista</button>
          </div>
        </form>
      </div>
    </div>

    <script src="/catalog/catalog-cart.js"></script>
    <script type="module" src="/catalog/catalog.logic.js"></script>
    <script defer src="/catalog/catalog.js"></script>
    <script defer src="/shared/analytics-guard.js"></script>
  </body>
</html>
